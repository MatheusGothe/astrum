
name: Astrum - Android E2E

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: HTTPS URL of the prebuilt Android APK
        required: false
        type: string
      apk_sha256:
        description: Expected SHA-256 of the APK (required when apk_url is set)
        required: false
        type: string

concurrency:
  group: astrum-android-e2e-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android-setup:
    name: Astrum Android E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ASTRUM_APP_ID: ${{ vars.ASTRUM_APP_ID }}
      ASTRUM_TEST_EMAIL_DOMAIN: ${{ vars.ASTRUM_TEST_EMAIL_DOMAIN }}
      ASTRUM_TEST_PASSWORD: ${{ secrets.ASTRUM_TEST_PASSWORD }}
      ASTRUM_TEST_NAME: ${{ vars.ASTRUM_TEST_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start benchmark
        run: |
          echo "BENCHMARK_START=$(date +%s)" >> "$GITHUB_ENV"
          echo "Runner CPU:"
          nproc
          echo "Memory:"
          free -h

      - name: Download and verify APK
        env:
          APK_URL: ${{ inputs.apk_url || secrets.ASTRUM_APK_URL }}
          APK_SHA256: ${{ inputs.apk_sha256 || secrets.ASTRUM_APK_SHA256 }}
        run: ./scripts/download-apk.sh

      - name: Require APK configuration
        run: |
          if [ ! -f artifacts/astrum.apk ]; then
            echo "No APK available. Provide workflow_dispatch inputs apk_url and apk_sha256, or configure ASTRUM_APK_URL and ASTRUM_APK_SHA256 secrets." >&2
            exit 1
          fi

      - name: Install Maestro CLI
        run: |
          START=$(date +%s)

          curl -Ls https://get.maestro.mobile.dev | bash

          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

          END=$(date +%s)
          echo "MAESTRO_SECONDS=$((END - START))" >> "$GITHUB_ENV"

      - name: Verify Maestro
        run: |
          maestro --version

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and boot Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            START=$(date +%s)
            adb install -r artifacts/astrum.apk
            echo "APK_INSTALL_SECONDS=$(($(date +%s) - START))" >> "$GITHUB_ENV"
            START=$(date +%s)
            ./scripts/run-tests.sh
            echo "MAESTRO_TEST_SECONDS=$(($(date +%s) - START))" >> "$GITHUB_ENV"

      - name: Upload Maestro JUnit report
        if: always() && hashFiles('artifacts/maestro-report.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report
          path: artifacts/maestro-report.xml
          retention-days: 7

      - name: Benchmark results
        if: always()
        run: |
          END=$(date +%s)
          TOTAL=$((END - BENCHMARK_START))

          echo "## Android Setup Benchmark" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Runner | ubuntu-24.04 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Maestro installation | ${MAESTRO_SECONDS:-N/A} seconds |" >> "$GITHUB_STEP_SUMMARY"
          echo "| APK installation | ${APK_INSTALL_SECONDS:-N/A} seconds |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Maestro tests | ${MAESTRO_TEST_SECONDS:-N/A} seconds |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Total execution | ${TOTAL} seconds |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Total minutes | $((TOTAL / 60))m $((TOTAL % 60))s |" >> "$GITHUB_STEP_SUMMARY"
