
name: Astrum - Android E2E

on:
  workflow_dispatch:
    inputs:
      play_store_url:
        description: Public Google Play listing URL for Astrum
        required: true
        default: https://play.google.com/store/apps/details?id=app.astrum.mobile&hl=pt_BR
        type: string

concurrency:
  group: astrum-android-e2e-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android-setup:
    name: Astrum Android E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ASTRUM_APP_ID: app.astrum.mobile
      ASTRUM_TEST_NAME: Astrum QA
      ASTRUM_PLAY_STORE_URL: ${{ inputs.play_store_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start benchmark
        run: |
          echo "BENCHMARK_START=$(date +%s)" >> "$GITHUB_ENV"
          echo "Runner CPU:"
          nproc
          echo "Memory:"
          free -h

      - name: Validate Play Store credentials
        env:
          PLAY_STORE_EMAIL: ${{ secrets.PLAY_STORE_EMAIL }}
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
        run: ./scripts/validate-play-store-credentials.sh

      - name: Install Maestro CLI
        run: |
          START=$(date +%s)

          curl -Ls https://get.maestro.mobile.dev | bash

          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

          END=$(date +%s)
          echo "MAESTRO_SECONDS=$((END - START))" >> "$GITHUB_ENV"

      - name: Verify Maestro
        run: |
          maestro --version

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and boot Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PLAY_STORE_EMAIL: ${{ secrets.PLAY_STORE_EMAIL }}
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            adb shell pm uninstall "$ASTRUM_APP_ID" >/dev/null 2>&1 || true
            START=$(date +%s)
            ./scripts/run-tests.sh
            echo "MAESTRO_TEST_SECONDS=$(($(date +%s) - START))" >> "$GITHUB_ENV"

      - name: Upload Maestro JUnit report
        if: always() && hashFiles('artifacts/maestro-report.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report
          path: artifacts/maestro-report.xml
          retention-days: 7

      - name: Benchmark results
        if: always()
        run: |
          END=$(date +%s)
          TOTAL=$((END - BENCHMARK_START))

          echo "## Android Setup Benchmark" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Runner | ubuntu-24.04 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Maestro installation | ${MAESTRO_SECONDS:-N/A} seconds |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Play Store installation | included in Maestro flow |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Maestro tests | ${MAESTRO_TEST_SECONDS:-N/A} seconds |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Total execution | ${TOTAL} seconds |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Total minutes | $((TOTAL / 60))m $((TOTAL % 60))s |" >> "$GITHUB_STEP_SUMMARY"
