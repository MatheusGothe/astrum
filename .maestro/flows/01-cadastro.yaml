appId: com.android.vending
name: Cadastro de usuário e acesso autenticado
---
- openLink:
    link: ${ASTRUM_PLAY_STORE_URL}
    autoVerify: true
- extendedWaitUntil:
    visible: "^(Install|Instalar)$"
    timeout: 60000
- tapOn:
    text: "^(Install|Instalar)$"
- extendedWaitUntil:
    visible: "^(Open|Abrir)$"
    timeout: 180000
- tapOn:
    text: "^(Open|Abrir)$"
- extendedWaitUntil:
    visible: "Astrum"
    timeout: 60000
- launchApp:
    appId: ${ASTRUM_APP_ID}
    clearState: true
- tapOn: "PT"
- assertVisible:
    text: "Astrum"
- tapOn:
    text: "Não tem conta? Cadastre-se"
- assertVisible:
    text: "Nome"
- tapOn:
    text: "Seu nome"
- inputText: ${ASTRUM_TEST_NAME}
- tapOn:
    text: "seu@email.com"
- inputText: ${ASTRUM_TEST_EMAIL}
- tapOn:
    text: "••••••••"
- inputText: ${ASTRUM_TEST_PASSWORD}
- scrollUntilVisible:
    element:
      text: "Sexo"
    direction: DOWN
- tapOn:
    text: "Prefiro não dizer"
- tapOn:
    text: "Selecione seu país"
- extendedWaitUntil:
    visible: "Brasil"
    timeout: 20000
- tapOn:
    text: "Brasil"
- tapOn:
    text: "Criar conta"
- assertVisible:
    text: "Mapa Geral"
- assertVisible:
    text: "Perfil"
